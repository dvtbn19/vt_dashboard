name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vtlab
          POSTGRES_PASSWORD: vtlab
          POSTGRES_DB: vtlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vtlab" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ../../packages/agent_sdk
      - run: ruff check app tests alembic
      - run: ruff format --check app tests
      - run: mypy
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vtlab:vtlab@127.0.0.1:5432/vtlab_test
        run: pytest

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
