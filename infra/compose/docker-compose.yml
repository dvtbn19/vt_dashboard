# Local development dependencies. Ports bind to loopback only.
#   docker compose -f infra/compose/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vtlab
      POSTGRES_PASSWORD: vtlab
      POSTGRES_DB: vtlab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtlab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
